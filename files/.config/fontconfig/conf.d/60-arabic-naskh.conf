<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Arabic: prefer Noto Naskh Arabic UI (readable Naskh) over Noto Kufi Arabic.
     The Latin font comes first, so only characters it lacks (Arabic) fall through to Naskh. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Naskh Arabic UI</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Naskh Arabic</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>Noto Naskh Arabic UI</family></prefer>
  </alias>
  <!-- 65-nonlatin.conf (runs after user config) lists "Noto Sans Arabic UI" for UI fonts
       like "Segoe UI"; hide that family so those requests fall through to Naskh too. -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Noto Sans Arabic UI</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Arabic</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
