# hyprlock — Tokyo Night × Steins;Gate
# Clear password: Esc / Ctrl+U

$font = JetBrainsMono Nerd Font
$blue = rgba(7aa2f7ff)
$magenta = rgba(bb9af7ff)
$orange = rgba(ff9e64ff)
$fg = rgba(c0caf5ff)
$comment = rgba(565f89ff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 5, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/Pictures/wallpapers/steins-gate-divergence.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    vibrancy = 0.2
}

# Clock — nixie orange glow
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = Noto Sans Light
    color = $orange
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(ff9e64aa)
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = $font
    color = $fg
    position = 0, 70
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = 󰀄  $USER
    font_size = 14
    font_family = $font
    color = $blue
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 16
    inner_color = rgba(1a1b26cc)
    outer_color = $blue $magenta 45deg
    check_color = rgba(7dcfffff) $blue 90deg
    fail_color = rgba(f7768eff) $orange 45deg
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i><span foreground="##565f89">El Psy Kongroo…</span></i>
    fail_text = <span foreground="##f7768e">$FAIL ($ATTEMPTS)</span>
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    position = 0, -90
    halign = center
    valign = center
}

# Footer
label {
    monitor =
    text = WORLDLINE DIVERGENCE  ·  1.048596
    font_size = 11
    font_family = $font
    color = $comment
    position = 0, 40
    halign = center
    valign = bottom
}

# Keyboard layout (click to switch) — your password is typed in the active layout
label {
    monitor =
    text = $LAYOUT[EN,ع]
    font_size = 13
    font_family = $font
    color = $comment
    onclick = hyprctl switchxkblayout all next
    position = 0, -150
    halign = center
    valign = center
}
