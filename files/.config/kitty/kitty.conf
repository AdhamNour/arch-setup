font_family      JetBrainsMono Nerd Font
font_size        11.5
background_opacity 0.82
window_padding_width 12
confirm_os_window_close 0
cursor_shape beam
cursor_trail 3
enable_audio_bell no

# Tokyo Night
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #283457
url_color #73daca
cursor #c0caf5
cursor_text_color #1a1b26

active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
tab_bar_background      #15161e
tab_bar_style           powerline

active_border_color   #7aa2f7
inactive_border_color #292e42

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #ff899d
color10 #9fe044
color11 #faba4a
color12 #8db0ff
color13 #c7a9ff
color14 #a4daff
color15 #c0caf5
color16 #ff9e64
color17 #db4b4b

# Clipboard: Ctrl+C copies if text is selected, otherwise interrupts (^C) as usual
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
# the defaults keep working too: ctrl+shift+c / ctrl+shift+v
