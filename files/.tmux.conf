# tmux — Tokyo Night
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10

# Prefix: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"

# Colours
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#7aa2f7"
set -g mode-style "bg=#283457,fg=#c0caf5"

set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold]  #S #[bg=#1a1b26,fg=#7aa2f7] "
set -g status-right "#[fg=#292e42]#[bg=#292e42,fg=#bb9af7] 󰥔 %H:%M #[fg=#3b4261]#[bg=#3b4261,fg=#c0caf5] 󰌢 #h "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89]  #I #W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#292e42]#[fg=#7dcfff,bg=#292e42,bold] #I #W #[fg=#292e42,bg=#1a1b26]"
